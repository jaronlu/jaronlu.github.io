site_name: Jaron Lu · AI Agent Engineer
site_description: Jaron Lu 的 AI Agent 工程作品集：可信 RAG、知识操作层与 Agent Skills 工程实践
site_author: Jaron Lu
site_url: https://jaronlu.github.io

repo_url: https://github.com/jaronlu/jaronlu.github.io
repo_name: jaronlu/jaronlu.github.io

theme:
  name: material
  language: zh
  icon:
    logo: material/graph-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换为深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换为浅色模式

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jaronlu
  generator: false

plugins:
  - search

# 本地发布规划文件，不进入站点构建
exclude_docs: |
  public-site.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

copyright: Copyright &copy; 2026 Jaron Lu

nav:
  - 首页: index.md
  - 项目:
    - projects/index.md
    - SecRAG: projects/secrag.md
    - llm-wiki-mcp: projects/llm-wiki-mcp.md
    - agent-skills: projects/agent-skills.md
  - 工程笔记:
    - agent/index.md
    - Agent 原理: agent/concepts/agent-principles.md
    - Agent Runtime: agent/concepts/agent-runtime.md
    - RAG 原理: agent/concepts/rag-principles.md
    - MCP 协议: agent/concepts/mcp-protocol.md
    - Loop Engineering: agent/concepts/loop-engineering.md
  - 关于: about.md
