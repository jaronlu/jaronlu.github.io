<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaron Lu · AI Agent Engineer</title>
    <script>
      // GitHub Pages 对未知路径返回 404.html。
      // 这里把请求路径暂存，再由应用入口恢复，避免深链直接刷新丢失路由。
      (function () {
        try {
          var p = location.pathname + location.search;
          if (p && p !== "/") {
            sessionStorage.setItem(":redirect", p);
          }
        } catch (e) {
          /* noop */
        }
        location.replace("/");
      })();
    </script>
  </head>
  <body></body>
</html>
