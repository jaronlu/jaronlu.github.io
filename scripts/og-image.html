<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>og-image</title>
    <style>
      /* 社交分享封面源文件：1200×630。重新生成见 scripts/README 或下方命令注释。
         生成命令（macOS，Chrome 已安装）：
         "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
           --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
           --screenshot=public/og-image.png scripts/og-image.html */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #fbf9f4;
        color: #171510;
        font-family: "PingFang SC", "Noto Sans SC", sans-serif;
        padding: 54px 68px 46px;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-bottom: 16px;
        border-bottom: 1px solid #e5e1d3;
        font-family: "Menlo", monospace;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6b675c;
      }
      .top .accent { color: #bf3a29; }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
      h1 {
        font-family: "Songti SC", Georgia, serif;
        font-size: 118px;
        line-height: 0.95;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .headline {
        margin-top: 26px;
        max-width: 860px;
        font-size: 33px;
        line-height: 1.42;
        font-weight: 500;
        color: #171510;
      }
      .headline em { font-style: normal; font-weight: 600; color: #bf3a29; }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding-top: 20px;
        border-top: 1px solid #e5e1d3;
        font-family: "Menlo", monospace;
        font-size: 15px;
        letter-spacing: 0.04em;
        color: #6b675c;
      }
      .bottom .site { color: #171510; font-weight: 600; }
      .rule { width: 56px; height: 3px; background: #bf3a29; margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <div class="top">
      <span>Portfolio — AI Agent Engineering</span>
      <span class="accent">Issue 2026 · Shenzhen / Remote</span>
    </div>

    <main>
      <h1>Jaron Lu</h1>
      <p class="headline">
        10 年金融工程经验，<br />构建<em>可验证、可审计</em>的 AI Agent 系统。
      </p>
    </main>

    <div class="bottom">
      <div>
        <div class="rule"></div>
        <span>Agentic RAG · LangGraph · MCP · 知识工程</span>
      </div>
      <span class="site">jaronlu.github.io</span>
    </div>
  </body>
</html>
